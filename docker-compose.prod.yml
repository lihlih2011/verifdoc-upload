version: '3.8'

services:
  # 1. Reverse Proxy HTTPS (Caddy)
  caddy:
    image: caddy:latest
    container_name: verifdoc-caddy
    restart: always
    ports:
      - "80:80" # HTTP (redirige vers HTTPS)
      - "443:443" # HTTPS sécurisé
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile # Fichier de config simple
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  # 2. Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifdoc-backend
    restart: always
    # Pas de ports exposés directement, Caddy gère l'accès
    expose:
      - "8000"
    volumes:
      - ./backend:/app/backend
      - ./verifdoc.db:/app/verifdoc.db
      - ./.env:/app/.env
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 4

  # 3. Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verifdoc-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
